<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Pixie & Pearls</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">
    <div class="admin-wrapper">
        <div class="admin-nav-bar">
            <h2>A to Z Website Control Panel</h2>
            <a href="/" class="btn-pink">Back to Website</a>
        </div>

        <!-- 1. Hero & Numbers -->
        <div class="admin-block">
            <h3>1. Hero & Brand Settings</h3>
            <label>Big Heading:</label>
            <input type="text" id="heroHeading">

            <label>Hero Paragraph:</label>
            <textarea id="heroParagraph" rows="2"></textarea>

            <label>Branding Praise / USP (Tareef):</label>
            <textarea id="heroPraise" rows="2"></textarea>

            <label>Main WhatsApp Number (Country code bina '+' ke, ex: 919876543210):</label>
            <input type="text" id="whatsappNumber">
        </div>

        <!-- 2. Catalogue Editor -->
        <div class="admin-block">
            <h3>2. Catalogue Section Settings</h3>
            <label>Catalogue Section Title:</label>
            <input type="text" id="catalogueTitle">

            <label>Catalogue Section Paragraph:</label>
            <textarea id="catalogueDesc" rows="2"></textarea>

            <label>Catalogue Download/View Link (PDF or Google Drive Link):</label>
            <input type="text" id="catalogueLink">
        </div>

        <!-- 3. Collection (Products) Editor -->
        <div class="admin-block">
            <div class="block-flex">
                <h3>3. Products Collection Settings</h3>
                <button type="button" class="btn-pink" onclick="addProduct()">+ Add New Product</button>
            </div>
            <label>Collection Section Title:</label>
            <input type="text" id="collectionTitle">

            <label>Collection Section Paragraph:</label>
            <textarea id="collectionDesc" rows="2"></textarea>

            <div id="product-admin-list" class="items-list"></div>
        </div>

        <!-- 4. Instagram Reels Editor -->
        <div class="admin-block">
            <div class="block-flex">
                <h3>4. Instagram Reels Section</h3>
                <button type="button" class="btn-pink" onclick="addReel()">+ Add Reel Link</button>
            </div>
            <label>Reels Section Title:</label>
            <input type="text" id="reelsTitle">

            <label>Reels Section Paragraph:</label>
            <textarea id="reelsDesc" rows="2"></textarea>

            <div id="reels-admin-list" class="items-list"></div>
        </div>

        <!-- 5. YouTube Shorts Editor -->
        <div class="admin-block">
            <div class="block-flex">
                <h3>5. YouTube Shorts Section</h3>
                <button type="button" class="btn-pink" onclick="addShort()">+ Add YouTube Short</button>
            </div>
            <label>Shorts Section Title:</label>
            <input type="text" id="shortsTitle">

            <label>Shorts Section Paragraph:</label>
            <textarea id="shortsDesc" rows="2"></textarea>

            <div id="shorts-admin-list" class="items-list"></div>
        </div>

        <!-- 6. Staff Editor -->
        <div class="admin-block">
            <div class="block-flex">
                <h3>6. Staff & Stylists Section</h3>
                <button type="button" class="btn-pink" onclick="addStaff()">+ Add Staff Member</button>
            </div>
            <label>Staff Section Title:</label>
            <input type="text" id="staffTitle">

            <label>Staff Section Paragraph:</label>
            <textarea id="staffDesc" rows="2"></textarea>

            <div id="staff-admin-list" class="items-list"></div>
        </div>

        <!-- 7. Form Headings -->
        <div class="admin-block">
            <h3>7. WhatsApp Contact Form Section</h3>
            <label>Form Title:</label>
            <input type="text" id="formTitle">

            <label>Form Paragraph:</label>
            <textarea id="formDesc" rows="2"></textarea>
        </div>

        <!-- 8. Security Password Input -->
        <div class="admin-block security-box">
            <h3>Admin Security Verification</h3>
            <label>Admin Security Password (Zaroori hai):</label>
            <input type="password" id="adminPassword" placeholder="Enter admin password to save" required>
        </div>

        <button type="button" class="btn-save-floating" onclick="saveAllChanges()">Save All Changes</button>
    </div>

    <script src="admin.js"></script>
</body>

</html>
